<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>RAGitify</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- src/favicon.ico was referenced but never existed, so every load 404'd.
       Point at the logo that ships in assets/ instead. -->
  <link rel="icon" type="image/svg+xml" href="assets/images/ragitify-logo.svg">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Font Awesome loaded non-blocking so first paint isn't gated on the icon font. -->
  <link rel="preload" as="style"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"
    onload="this.onload=null;this.rel='stylesheet';" />
  <noscript>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
  </noscript>
  <!--
    Brand typeface: Geist (UI + display) / Geist Mono (code, SQL, IDs, metrics).
    The full variable weight axis is requested so the in-between weights the
    components already use (550, 650, 800, 850) render as real instances
    instead of being clamped or faux-bolded — one file per family either way.
  -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..700&display=swap">
</head>

<body>
  <app-root></app-root>
</body>

</html>
