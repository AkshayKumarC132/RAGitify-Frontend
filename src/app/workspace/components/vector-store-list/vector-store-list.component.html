<div class="vector-store-list">
  <div *ngFor="let store of vectorStores" class="store-item card-premium"
    [class.selected]="selectedVectorStore?.id === store.id" (click)="selectStore(store)">
    <div class="store-meta">
      <div class="store-name">{{ store.name }}</div>
      <div class="store-date">
        <i class="fa-regular fa-calendar"></i>
        {{ formatDate(store.created_at) }}
      </div>
      <div class="store-docs">
        <i class="fa-solid fa-file-lines"></i>
        <span>{{ getDocCount(store) }} docs</span>
      </div>
      <div class="store-progress">
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="getProgressPercent(store)"></div>
        </div>
      </div>
    </div>
    <div class="store-actions">
      <button type="button" class="btn-premium-icon" (click)="requestChat(store, $event)" title="Chat with library">
        <i class="fa-solid fa-comments"></i>
      </button>
      <button type="button" class="btn-premium-icon" (click)="requestEdit(store, $event)" title="Rename library">
        <i class="fa-solid fa-pen"></i>
      </button>
      <button type="button" class="btn-premium-icon danger" (click)="requestDelete(store, $event)"
        title="Delete library">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  </div>
  <div *ngIf="vectorStores.length === 0" class="empty-state">
    No library entries found.
  </div>
</div>
