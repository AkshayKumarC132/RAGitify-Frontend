<div class="vector-store-list">
  <h2>
    <i class="fa-solid fa-folder-tree"></i>
    <span>Library</span>
  </h2>
  <div *ngFor="let store of vectorStores"
       class="store-item"
       [class.selected]="selectedVectorStore?.id === store.id"
       (click)="selectStore(store)">
    <div class="store-meta">
      <div class="store-name">{{ store.name }}</div>
      <div class="store-date">Created: {{ formatDate(store.created_at) }}</div>
    </div>
    <div class="store-actions">
      <button type="button" (click)="requestEdit(store, $event)" title="Rename library">
        <i class="fa-solid fa-pen"></i>
      </button>
      <button type="button" (click)="requestDelete(store, $event)" title="Delete library">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  </div>
  <div *ngIf="vectorStores.length === 0" class="empty-state">
    No library entries found.
  </div>
</div>
