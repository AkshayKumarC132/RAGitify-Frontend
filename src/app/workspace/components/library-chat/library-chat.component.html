<div class="library-chat-overlay" (click)="close()">
    <div class="library-chat-panel" (click)="$event.stopPropagation()">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-content">
                <i class="fa-solid fa-folder-tree"></i>
                <div class="header-text">
                    <h3>Library Chat: {{ vectorStore?.name || 'Library' }}</h3>
                    <span class="library-status">
                        <span class="status-badge">
                            Searching entire library
                        </span>
                    </span>
                </div>
            </div>
            <button type="button" class="close-button" (click)="close()" aria-label="Close chat">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Error Message -->
        <div class="error-banner" *ngIf="errorMessage">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ errorMessage }}</span>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" #messagesContainer>
            <div *ngIf="messages.length === 0" class="empty-state">
                <i class="fa-solid fa-comments"></i>
                <p>Chat with your library</p>
                <span class="empty-state-hint">
                    Ask questions across all documents in <strong>{{ vectorStore?.name }}</strong>.
                </span>
            </div>

            <app-message-bubble *ngFor="let message of messages; let last = last" [message]="message" [isLast]="last" [showSources]="false" [isStreaming]="last && isResponseInProgress && message.role === 'assistant'">
            </app-message-bubble>

            <app-typing-indicator *ngIf="showTypingIndicator" [cycle]="true"></app-typing-indicator>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea #messageInput [(ngModel)]="messageInputText" (keydown)="onKeyPress($event)"
                    placeholder="Ask a question about this library..." class="chat-input"
                    [disabled]="loading || isResponseInProgress" rows="1"></textarea>
                <div class="input-actions">
                    <button type="button" class="send-button" (click)="sendMessage()"
                        [disabled]="!messageInputText.trim() || loading || isResponseInProgress" title="Send message"
                        aria-label="Send message">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
