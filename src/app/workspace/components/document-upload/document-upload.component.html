<div class="document-upload">
  <h2>
    <i class="fa-solid fa-cloud-arrow-up"></i>
    <span>Upload Document</span>
  </h2>
  
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div class="form-group">
    <label>Library</label>
    <select [(ngModel)]="selectedVectorStoreId" class="form-control">
      <option value="">Select library</option>
      <option *ngFor="let store of vectorStores" [value]="store.id">{{ store.name }}</option>
    </select>
  </div>

  <div class="form-group">
    <label>File</label>
    <input type="file" (change)="onFileSelected($event)" class="form-control" />
    <div *ngIf="selectedFile" class="file-info">
      Selected: {{ selectedFile.name }}
    </div>
  </div>

  <div *ngIf="loading" class="progress">
    <div class="progress-bar" [style.width.%]="uploadProgress"></div>
  </div>
  <div *ngIf="loading || uploadProgress === 100" class="progress-meta">
    <span>{{ uploadStatus || 'Preparing upload...' }}</span>
    <span *ngIf="uploadProgress">{{ uploadProgress }}%</span>
  </div>

  <div class="form-actions">
    <button class="btn-primary" (click)="onUpload()" [disabled]="loading || !selectedFile || !selectedVectorStoreId">
      <i class="fa-solid" [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>
      <span>{{ loading ? 'Uploading…' : 'Upload' }}</span>
    </button>
    <button class="btn-secondary" (click)="onCancel()" [disabled]="loading">
      <i class="fa-solid fa-xmark"></i>
      <span>Cancel</span>
    </button>
  </div>
</div>
