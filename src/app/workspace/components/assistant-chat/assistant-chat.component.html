<div class="assistant-chat-overlay" (click)="close()">
    <div class="assistant-chat-panel" (click)="$event.stopPropagation()">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-content">
                <i class="fa-solid fa-robot"></i>
                <div class="header-text">
                    <h3>Testing: {{ assistant?.name || 'Assistant' }}</h3>
                    <span class="assistant-status">
                        <span class="status-badge" [class.has-kb]="!!assistant?.vector_store_id">
                            {{ assistant?.model || 'Default Model' }}
                            <ng-container *ngIf="assistant?.vector_store_id"> â€¢ Has Knowledge</ng-container>
                        </span>
                    </span>
                </div>
            </div>
            <button type="button" class="close-button" (click)="close()" aria-label="Close chat">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Error Message -->
        <div class="error-banner" *ngIf="errorMessage">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ errorMessage }}</span>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" #messagesContainer>
            <div *ngIf="messages.length === 0" class="empty-state">
                <i class="fa-solid fa-robot"></i>
                <p>Test your assistant instructions</p>
                <span class="empty-state-hint">
                    {{ assistant?.instructions ? 'This assistant has custom instructions.' : 'No custom instructions
                    set.' }}
                </span>
            </div>

            <app-message-bubble *ngFor="let message of messages; let last = last" [message]="message" [isLast]="last" [conversationId]="conversation?.id" [enableDataGrid]="conversation?.enable_data_grid || false" [isStreaming]="last && isResponseInProgress && message.role === 'assistant'">
            </app-message-bubble>

            <app-typing-indicator *ngIf="isResponseInProgress" [cycle]="true"></app-typing-indicator>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea #messageInput [(ngModel)]="messageInputText" (keydown)="onKeyPress($event)"
                    (input)="autoResizeInput()" placeholder="Test your assistant..." class="chat-input"
                    [class.is-scrolling]="isOverflowing"
                    [disabled]="loading || isResponseInProgress" rows="1"></textarea>
                <div class="input-actions">
                    <button type="button" class="send-button" (click)="sendMessage()"
                        [disabled]="!messageInputText.trim() || loading || isResponseInProgress" title="Send message"
                        aria-label="Send message">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
