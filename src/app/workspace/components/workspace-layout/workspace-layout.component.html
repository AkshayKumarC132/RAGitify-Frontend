<div class="workspace-container" [class.sidebar-collapsed]="sidebarCollapsed">
  <aside class="workspace-sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header" [class.show-expand-control]="sidebarCollapsed && hoveringExpandControl">
      <button type="button" class="brand-toggle" (click)="onBrandClick()"
        [attr.title]="sidebarCollapsed ? null : 'Home'" (mouseenter)="handleBrandExpandInteraction(true)"
        (mouseleave)="handleBrandExpandInteraction(false)" (focus)="handleBrandExpandInteraction(true)"
        (blur)="handleBrandExpandInteraction(false)">
        <img src="assets/images/ragitify-logo.svg" alt="RAGitify logo" class="brand-logo" />
        <div class="brand-text" *ngIf="!sidebarCollapsed">
          <div class="brand-title">RAGitify</div>
        </div>
      </button>

      <button class="sidebar-toggle-control" type="button" (click)="toggleSidebar(undefined, $event)"
        [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
        (mouseenter)="handleToggleExpandInteraction(true)" (mouseleave)="handleToggleExpandInteraction(false)"
        (focus)="handleToggleExpandInteraction(true)" (blur)="handleToggleExpandInteraction(false)">
        <i class="fa-solid" [ngClass]="sidebarCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
      </button>
    </div>

    <!-- New Chat / Workspace / Prompts: hidden when in Knowledge Library -->
    <nav class="sidebar-actions" *ngIf="showLibraryPicker || activeSection === 'prompts'">
      <button type="button" class="new-thread-button" (click)="goToNewChat()" aria-label="Start a new chat"
        [attr.data-tooltip]="sidebarCollapsed ? 'Start a new chat' : null"
        [attr.title]="sidebarCollapsed ? 'Start a new chat' : null">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        <span class="button-text" *ngIf="!sidebarCollapsed">New Chat</span>
      </button>
      <button type="button" class="workspace-button" [class.active]="activeSection !== 'prompts'"
        (click)="goToWorkspace()" aria-label="Open workspace"
        [attr.data-tooltip]="sidebarCollapsed ? 'Workspace' : null"
        [attr.title]="sidebarCollapsed ? 'Open workspace' : null">
        <i class="fa-solid fa-briefcase" aria-hidden="true"></i>
        <span class="button-text" *ngIf="!sidebarCollapsed">Workspace</span>
      </button>
      <button type="button" class="workspace-button" [class.active]="activeSection === 'prompts'"
        (click)="goToPrompts()" aria-label="Open prompts"
        [attr.data-tooltip]="sidebarCollapsed ? 'Prompts' : null"
        [attr.title]="sidebarCollapsed ? 'Open prompts' : null">
        <i class="fa-solid fa-robot" aria-hidden="true"></i>
        <span class="button-text" *ngIf="!sidebarCollapsed">Prompts</span>
      </button>
    </nav>

    <!-- Knowledge tab (inside a library): show library list and summary -->
    <ng-container *ngIf="!showLibraryPicker && activeSection === 'knowledge'">
      <div class="knowledge-sidebar-block">
        <div class="library-search-row" *ngIf="!sidebarCollapsed">
          <div class="library-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input class="library-search-input" type="text" [(ngModel)]="librarySearchQuery"
              (ngModelChange)="onSidebarSearchChange($event)" [placeholder]="activeDocumentId ? 'Search documents' : 'Search libraries...'"
              [attr.aria-label]="activeDocumentId ? 'Search documents' : 'Search libraries'" />
            <button type="button" class="library-search-clear" *ngIf="librarySearchQuery"
              (click)="librarySearchQuery = ''" title="Clear search">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <button type="button" class="library-add-btn"
            (click)="openUploadOrNewLibrary(activeDocumentId ? 'upload' : 'library')"
            [title]="activeDocumentId ? 'Upload Document' : 'New Library'">
            <i class="fa-solid" [ngClass]="activeDocumentId ? 'fa-arrow-up' : 'fa-plus'"></i>
          </button>
        </div>
        <button type="button" class="library-add-btn library-add-btn-collapsed" *ngIf="sidebarCollapsed"
          (click)="openUploadOrNewLibrary(activeDocumentId ? 'upload' : 'library')"
          [attr.aria-label]="activeDocumentId ? 'Upload document' : 'New library'"
          [attr.data-tooltip]="activeDocumentId ? 'Upload Document' : 'New Library'"
          [title]="activeDocumentId ? 'Upload Document' : 'New Library'">
          <i class="fa-solid" aria-hidden="true" [ngClass]="activeDocumentId ? 'fa-arrow-up' : 'fa-plus'"></i>
        </button>
        <div class="sidebar-library-list" *ngIf="!sidebarCollapsed && !activeDocumentId">
          <app-vector-store-list [vectorStores]="filteredVectorStores" [selectedVectorStore]="layoutSelectedStore"
            [documentCounts]="libraryDocCounts" (vectorStoreSelected)="onLayoutLibrarySelect($event)"
            (editRequested)="onLayoutEditLibrary($event)" (deleteRequested)="onLayoutDeleteLibrary($event)"
            (chatRequested)="onLayoutChatLibrary($event)"
            (statsRequested)="onLayoutStatsLibrary($event)"></app-vector-store-list>
        </div>
        <div class="sidebar-document-list" *ngIf="!sidebarCollapsed && activeDocumentId">
          <app-document-sidebar-list [libraryId]="layoutSelectedStore?.id"
            [activeDocumentId]="activeDocumentId"></app-document-sidebar-list>
        </div>
      </div>
    </ng-container>

    <!-- Bottom: Home and Logout (hidden inside Knowledge Library workspace view) -->
    <div class="sidebar-footer" *ngIf="showLibraryPicker || activeSection === 'prompts'">
      <button type="button" class="sidebar-footer-btn" (click)="goToHome()" aria-label="Go to home"
        [attr.data-tooltip]="sidebarCollapsed ? 'Home' : null" title="Home">
        <span>Home</span>
      </button>
      <button type="button" class="sidebar-footer-btn danger" (click)="logout()" aria-label="Log out"
        [attr.data-tooltip]="sidebarCollapsed ? 'Log out' : null" title="Log out">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main: picker when no library selected, otherwise workspace content -->
  <ng-container *ngIf="showLibraryPicker">
    <div class="workspace-picker-full">
      <app-workspace-library-picker></app-workspace-library-picker>
    </div>
  </ng-container>

  <div class="workspace-content" *ngIf="!showLibraryPicker">
    <div class="workspace-top-bar" *ngIf="activeSection === 'knowledge'">
      <div class="top-bar-brand">
        <button type="button" class="crumb-link" (click)="goToHome()">
          <span>Home</span>
        </button>
        <span class="crumb-separator"><i class="fa-solid fa-chevron-right" style="font-size: 0.8em;"></i></span>
        <button type="button" class="crumb-link" (click)="goToLibraryPicker()">
          <span>Knowledge Library</span>
        </button>
        <ng-container *ngIf="!showLibraryPicker && layoutSelectedStore && !activeDocumentId && !activeLibraryStatsId">
          <span class="crumb-separator"><i class="fa-solid fa-chevron-right" style="font-size: 0.8em;"></i></span>
          <span class="crumb-current" [title]="layoutSelectedStore.name">{{
            getBreadcrumbLibraryName(layoutSelectedStore.name) }}</span>
        </ng-container>
        <ng-container *ngIf="activeLibraryStatsId && layoutSelectedStore">
          <span class="crumb-separator"><i class="fa-solid fa-chevron-right" style="font-size: 0.8em;"></i></span>
          <button type="button" class="crumb-link" (click)="goToCurrentLibrary()">
            <span [title]="layoutSelectedStore.name">{{ getBreadcrumbLibraryName(layoutSelectedStore.name) }}</span>
          </button>
          <span class="crumb-separator"><i class="fa-solid fa-chevron-right" style="font-size: 0.8em;"></i></span>
          <span class="crumb-current">Analytics</span>
        </ng-container>
        <ng-container *ngIf="activeDocumentId && (layoutSelectedStore || activeDocumentId)">
          <span class="crumb-separator"><i class="fa-solid fa-chevron-right" style="font-size: 0.8em;"></i></span>
          <button type="button" class="crumb-link" (click)="goToCurrentLibrary()">
            <span [title]="layoutSelectedStore?.name || 'Library'">{{
              getBreadcrumbLibraryName(layoutSelectedStore?.name) }}</span>
          </button>
        </ng-container>
        <ng-container *ngIf="activeDocumentId">
          <span class="crumb-separator"><i class="fa-solid fa-chevron-right" style="font-size: 0.8em;"></i></span>
          <span class="crumb-current">Document Details</span>
        </ng-container>
      </div>
      <div class="top-bar-right">
        <button type="button" class="cmd-k-trigger" (click)="openCommandPalette()" title="Search (Ctrl/⌘ + K)"
          aria-label="Open command palette">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <span class="cmd-k-label">Search</span>
          <span class="cmd-k-kbd"><kbd>⌘</kbd><kbd>K</kbd></span>
        </button>
        <app-theme-toggle [compact]="true"></app-theme-toggle>
        <button type="button" class="upload-button" (click)="openUploadOrNewLibrary('upload')"
          *ngIf="activeSection === 'knowledge' && !activeDocumentId && !activeLibraryStatsId">
          <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
          <span>Upload</span>
        </button>
      </div>
    </div>

    <div class="workspace-panels">
      <app-prompts-section *ngIf="activeSection === 'prompts'"></app-prompts-section>
      <app-document-details-page *ngIf="activeSection === 'knowledge' && activeDocumentId"
        [documentId]="activeDocumentId"></app-document-details-page>
      <app-library-stats-page *ngIf="activeSection === 'knowledge' && activeLibraryStatsId && !activeDocumentId"
        [libraryId]="activeLibraryStatsId"></app-library-stats-page>
      <app-knowledge-section *ngIf="activeSection === 'knowledge' && !activeDocumentId && !activeLibraryStatsId"></app-knowledge-section>
    </div>
  </div>
</div>
