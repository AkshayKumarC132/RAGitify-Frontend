<div class="workspace-container">
  <div class="workspace-sidebar">
    <div class="sidebar-header">
      <h2>Workspace</h2>
    </div>
    
    <nav class="sidebar-nav">
      <button
        class="nav-item"
        [class.active]="activeSection === 'models'"
        (click)="setActiveSection('models')"
      >
        <span class="icon">🤖</span>
        <span>Models</span>
      </button>
      
      <button
        class="nav-item"
        [class.active]="activeSection === 'knowledge'"
        (click)="setActiveSection('knowledge')"
      >
        <span class="icon">📚</span>
        <span>Knowledge</span>
      </button>
      
      <button
        class="nav-item"
        [class.active]="activeSection === 'prompts'"
        (click)="setActiveSection('prompts')"
      >
        <span class="icon">💬</span>
        <span>Prompts</span>
      </button>
      
      <button
        class="nav-item"
        [class.active]="activeSection === 'tools'"
        (click)="setActiveSection('tools')"
      >
        <span class="icon">🔧</span>
        <span>Tools</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/home" class="nav-link">Home</a>
      <button class="logout-button" (click)="logout()">Logout</button>
    </div>
  </div>

  <div class="workspace-content">
    <app-models-section *ngIf="activeSection === 'models'"></app-models-section>
    <app-knowledge-section *ngIf="activeSection === 'knowledge'"></app-knowledge-section>
    <app-prompts-section *ngIf="activeSection === 'prompts'"></app-prompts-section>
    <app-tools-section *ngIf="activeSection === 'tools'"></app-tools-section>
  </div>
</div>
