<div class="workspace-container" [class.sidebar-collapsed]="sidebarCollapsed">
  <aside class="workspace-sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header" [class.show-expand-control]="sidebarCollapsed && hoveringExpandControl">
      <button
        type="button"
        class="brand-toggle"
        (click)="toggleSidebar(undefined, $event)"
        [attr.title]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
        (mouseenter)="handleBrandExpandInteraction(true)"
        (mouseleave)="handleBrandExpandInteraction(false)"
        (focus)="handleBrandExpandInteraction(true)"
        (blur)="handleBrandExpandInteraction(false)"
      >
        <img src="assets/images/ragitify-logo.svg" alt="RAGitify logo" class="brand-logo" />
        <div class="brand-text" *ngIf="!sidebarCollapsed">
          <p class="eyebrow">RAGitify</p>
          <h2>Workspace</h2>
        </div>
      </button>

      <button
        class="sidebar-toggle-control"
        type="button"
        (click)="toggleSidebar(undefined, $event)"
        [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
        (mouseenter)="handleToggleExpandInteraction(true)"
        (mouseleave)="handleToggleExpandInteraction(false)"
        (focus)="handleToggleExpandInteraction(true)"
        (blur)="handleToggleExpandInteraction(false)"
      >
        <i class="fa-solid" [ngClass]="sidebarCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
      </button>
    </div>

    <nav class="sidebar-actions">
      <button type="button" (click)="startNewChat()">
        <i class="fa-solid fa-comments"></i>
        <span>New Chat</span>
      </button>
      <button type="button" class="active">
        <i class="fa-solid fa-briefcase"></i>
        <span>Workspace</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/home" class="nav-link">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Home</span>
      </a>
      <button class="logout-button" (click)="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <div class="workspace-content">
    <div class="workspace-top-bar">
      <div>
        <p class="eyebrow">Workspace hub</p>
        <h1>Manage your intelligence stack</h1>
      </div>
      <div class="workspace-tabs">
        <button type="button" [class.active]="activeSection === 'knowledge'" (click)="setActiveSection('knowledge')">
          <i class="fa-solid fa-folder-open"></i>
          <span>Knowledge</span>
        </button>
        <button type="button" [class.active]="activeSection === 'prompts'" (click)="setActiveSection('prompts')">
          <i class="fa-solid fa-message"></i>
          <span>Prompts</span>
        </button>
        <button type="button" [class.active]="activeSection === 'models'" (click)="setActiveSection('models')">
          <i class="fa-solid fa-robot"></i>
          <span>Models</span>
        </button>
      </div>
    </div>

    <div class="workspace-panels">
      <app-prompts-section *ngIf="activeSection === 'prompts'"></app-prompts-section>
      <app-models-section *ngIf="activeSection === 'models'"></app-models-section>
      <app-knowledge-section *ngIf="activeSection === 'knowledge'"></app-knowledge-section>
    </div>
  </div>
</div>
