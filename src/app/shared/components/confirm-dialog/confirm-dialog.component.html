<div class="dialog-backdrop" (click)="onCancel()">
  <div class="confirm-dialog" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <div class="dialog-icon-wrapper">
        <i class="fa-solid fa-triangle-exclamation" *ngIf="data.type === 'danger'"></i>
        <i class="fa-solid fa-circle-info" *ngIf="data.type !== 'danger'"></i>
      </div>
      <h3 class="dialog-title">{{ data.title }}</h3>
    </div>

    <div class="dialog-content">
      <p class="dialog-message">
        <span [innerHTML]="data.message"></span>
        <strong *ngIf="data.itemName"> {{ data.itemName }}</strong>
      </p>
      <p class="dialog-secondary-message" *ngIf="data.secondaryMessage">
        {{ data.secondaryMessage }}
      </p>

      <div class="dialog-prompt" *ngIf="data.isPrompt">
        <input type="text" [(ngModel)]="promptValue" [placeholder]="data.promptPlaceholder || 'Enter value...'"
          (keydown.enter)="onConfirm()" #promptInput />
      </div>
    </div>

    <div class="dialog-actions">
      <button class="btn-premium-secondary" (click)="onCancel()">
        {{ data.cancelText || 'Cancel' }}
      </button>
      <button class="confirm-btn btn-premium-primary" [class.danger-text]="data.type === 'danger'"
        (click)="onConfirm()">
        {{ data.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
