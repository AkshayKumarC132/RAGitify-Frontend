<div class="dialog-backdrop" (click)="onBackdropClick($event)">
  <div #dialogElement class="confirm-dialog" tabindex="0" role="dialog" aria-labelledby="dialog-title" aria-modal="true">
    <h2 id="dialog-title" class="dialog-title">{{ title }}</h2>
    
    <div class="dialog-content">
      <p class="dialog-message">
        {{ message }} <strong>{{ itemName }}</strong>.
      </p>
      
      <p *ngIf="secondaryMessage" class="dialog-secondary-message">
        {{ secondaryMessage }}
      </p>
    </div>
    
    <div class="dialog-actions">
      <button 
        type="button" 
        class="btn-cancel" 
        (click)="onCancel()"
        aria-label="Cancel">
        Cancel
      </button>
      <button 
        type="button" 
        class="btn-delete" 
        (click)="onConfirm()"
        aria-label="Delete">
        Delete
      </button>
    </div>
  </div>
</div>
