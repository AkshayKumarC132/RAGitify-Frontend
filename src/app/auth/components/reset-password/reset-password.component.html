<div class="auth-shell">
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="auth-container-standard centered-single forgot-card">
        <div class="forgot-header">
            <button type="button" class="back-btn" (click)="backToLogin()" aria-label="Back to login">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </button>
            <div class="forgot-icon">
                <i class="fa-solid fa-lock" aria-hidden="true"></i>
            </div>
            <h1>Choose a new password</h1>
            <p class="forgot-subtitle">
                Pick a strong password you haven't used elsewhere.
            </p>
        </div>

        <div *ngIf="errorMessage" class="error-message reset-error" role="alert">
            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
            <span>{{ errorMessage }}</span>
        </div>

        <ng-container *ngIf="!submitted; else doneState">
            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
                <div class="form-group">
                    <label for="reset-password">New password</label>
                    <div class="input-wrapper password-wrapper">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input [type]="showPassword ? 'text' : 'password'" id="reset-password" formControlName="password"
                            placeholder="••••••••" autocomplete="new-password" />
                        <button type="button" class="password-toggle" (click)="showPassword = !showPassword"
                            tabindex="-1" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                            <i [class]="showPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"
                                aria-hidden="true"></i>
                        </button>
                    </div>

                    <ul class="password-checklist" *ngIf="form.get('password')?.value" aria-label="Password requirements">
                        <li *ngFor="let check of passwordChecks" [class.is-met]="check.ok">
                            <i class="fa-solid" [ngClass]="check.ok ? 'fa-circle-check' : 'fa-circle'"
                                aria-hidden="true"></i>
                            <span>{{ check.label }}</span>
                        </li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="reset-confirm">Confirm password</label>
                    <div class="input-wrapper password-wrapper">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input [type]="showPassword ? 'text' : 'password'" id="reset-confirm" formControlName="confirm"
                            placeholder="••••••••" autocomplete="new-password" />
                    </div>
                    <small *ngIf="form.errors?.['mismatch'] && form.get('confirm')?.touched">
                        Passwords don't match.
                    </small>
                </div>

                <button type="submit" class="btn-primary btn-block"
                    [disabled]="form.invalid || submitting || !token">
                    <span *ngIf="!submitting">Update password <i class="fa-solid fa-check" aria-hidden="true"></i></span>
                    <span *ngIf="submitting"><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
                        Updating…</span>
                </button>

                <button type="button" class="btn-primary btn-ghost btn-block" (click)="backToLogin()">
                    Back to sign in
                </button>
            </form>
        </ng-container>

        <ng-template #doneState>
            <div class="success-card" role="status" aria-live="polite">
                <div class="success-icon">
                    <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                </div>
                <h2>Password updated</h2>
                <p>Redirecting you to sign in…</p>
            </div>
        </ng-template>
    </div>
</div>
