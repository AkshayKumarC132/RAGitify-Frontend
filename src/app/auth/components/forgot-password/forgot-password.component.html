<div class="auth-shell">
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="auth-container-standard centered-single forgot-card">
        <div class="forgot-header">
            <button type="button" class="back-btn" (click)="backToLogin()" aria-label="Back to login">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </button>
            <div class="forgot-icon">
                <i class="fa-solid fa-key" aria-hidden="true"></i>
            </div>
            <h1>Reset your password</h1>
            <p class="forgot-subtitle">
                Enter the email tied to your workspace and we'll send a secure reset link.
            </p>
        </div>

        <ng-container *ngIf="!submitted; else successState">
            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
                <div class="form-group">
                    <label for="forgot-email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="forgot-email" formControlName="email"
                            [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
                            placeholder="you@company.com" autocomplete="email" />
                    </div>
                    <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
                        A valid email is required.
                    </small>
                </div>

                <button type="submit" class="btn-primary btn-block" [disabled]="form.invalid || submitting">
                    <span *ngIf="!submitting">Send reset link <i class="fa-solid fa-paper-plane"
                            aria-hidden="true"></i></span>
                    <span *ngIf="submitting"><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
                        Sending…</span>
                </button>

                <button type="button" class="btn-primary btn-ghost btn-block" (click)="backToLogin()">
                    Back to sign in
                </button>
            </form>
        </ng-container>

        <ng-template #successState>
            <div class="success-card" role="status" aria-live="polite">
                <div class="success-icon">
                    <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                </div>
                <h2>Check your inbox</h2>
                <p>
                    If a RAGitify account exists for the address you entered, you'll receive a
                    password reset link within a few minutes.
                </p>
                <button type="button" class="btn-primary btn-block" (click)="backToLogin()">
                    Return to sign in
                </button>
            </div>
        </ng-template>
    </div>
</div>
