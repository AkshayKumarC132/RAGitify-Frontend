<div class="register-wrapper">
  <div class="register-copy">
    <h2>Create your workspace seat</h2>
    <p>Every new seat includes access to prompts, models, and document libraries.</p>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
    <label>
      <span>Email *</span>
      <input
        type="email"
        id="email"
        formControlName="email"
        [class.error]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
        placeholder="you@ragitify.ai"
      />
      <small *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">Valid email required</small>
    </label>

    <div class="two-column">
      <label>
        <span>Username *</span>
        <input
          type="text"
          id="username"
          formControlName="username"
          [class.error]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched"
          placeholder="workspace admin"
        />
        <small *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">Required</small>
      </label>

      <label>
        <span>Password *</span>
        <input
          type="password"
          id="password"
          formControlName="password"
          [class.error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
          placeholder="••••••"
        />
        <small *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">Minimum 6 characters</small>
      </label>
    </div>

    <div class="two-column">
      <label>
        <span>First Name</span>
        <input type="text" id="first_name" formControlName="first_name" placeholder="First name" />
      </label>
      <label>
        <span>Last Name</span>
        <input type="text" id="last_name" formControlName="last_name" placeholder="Last name" />
      </label>
    </div>

    <label>
      <span>Tenant Name *</span>
      <input
        type="text"
        id="tenant_name"
        formControlName="tenant_name"
        [class.error]="registerForm.get('tenant_name')?.invalid && registerForm.get('tenant_name')?.touched"
        placeholder="Acme Labs"
      />
      <small *ngIf="registerForm.get('tenant_name')?.invalid && registerForm.get('tenant_name')?.touched">Tenant is required</small>
    </label>

    <label>
      <span>Collection Name</span>
      <input type="text" id="collection_name" formControlName="collection_name" placeholder="Optional" />
    </label>

    <div class="register-actions">
      <button type="button" (click)="goBack()">Back to login</button>
      <button type="submit" class="btn-primary" [disabled]="loading || registerForm.invalid">
        <span *ngIf="!loading">Create workspace</span>
        <span *ngIf="loading">Creating account...</span>
      </button>
    </div>
  </form>
</div>
