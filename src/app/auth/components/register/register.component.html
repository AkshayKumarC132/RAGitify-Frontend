<div>
  <div class="auth-header">
    <h1>Create Account</h1>
    <p>Sign up to get started</p>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email *</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-control"
        [class.error]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
        placeholder="Enter your email"
      />
      <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="error-text">
        Please enter a valid email
      </div>
    </div>

    <div class="form-group">
      <label for="username">Username *</label>
      <input
        type="text"
        id="username"
        formControlName="username"
        class="form-control"
        [class.error]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched"
        placeholder="Choose a username"
      />
      <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="error-text">
        Username is required
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password *</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        class="form-control"
        [class.error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
        placeholder="Enter your password"
      />
      <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error-text">
        Password must be at least 6 characters
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="first_name">First Name</label>
        <input
          type="text"
          id="first_name"
          formControlName="first_name"
          class="form-control"
          placeholder="First name"
        />
      </div>

      <div class="form-group">
        <label for="last_name">Last Name</label>
        <input
          type="text"
          id="last_name"
          formControlName="last_name"
          class="form-control"
          placeholder="Last name"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="tenant_name">Tenant Name *</label>
      <input
        type="text"
        id="tenant_name"
        formControlName="tenant_name"
        class="form-control"
        [class.error]="registerForm.get('tenant_name')?.invalid && registerForm.get('tenant_name')?.touched"
        placeholder="Enter tenant name"
      />
      <div *ngIf="registerForm.get('tenant_name')?.invalid && registerForm.get('tenant_name')?.touched" class="error-text">
        Tenant name is required
      </div>
    </div>

    <div class="form-group">
      <label for="collection_name">Collection Name</label>
      <input
        type="text"
        id="collection_name"
        formControlName="collection_name"
        class="form-control"
        placeholder="Collection name (optional)"
      />
    </div>

    <button type="submit" class="btn-primary" [disabled]="loading || registerForm.invalid">
      <span *ngIf="!loading">Sign Up</span>
      <span *ngIf="loading">Creating account...</span>
    </button>
  </form>

  <div class="auth-footer">
    <p>Already have an account? <a (click)="goBack()" class="link">Sign in</a></p>
  </div>
</div>
