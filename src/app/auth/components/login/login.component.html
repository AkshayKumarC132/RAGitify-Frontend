<div class="auth-shell">
  <div class="auth-illustration">
    <img src="assets/images/ragitify-logo.svg" alt="RAGitify" class="hero-logo" />
    <h1>RAGitify Workspace</h1>
    <p>Trusted environment for organizing prompts, models, and knowledge.</p>
    <ul>
      <li><i class="fa-solid fa-lock"></i> Enterprise security baked in</li>
      <li><i class="fa-solid fa-sparkles"></i> Curated prompt & model library</li>
      <li><i class="fa-solid fa-users"></i> Collaborate with your entire team</li>
    </ul>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button type="button" [class.active]="!showRegister" (click)="setAuthMode(false)">Sign In</button>
      <button type="button" [class.active]="showRegister" (click)="setAuthMode(true)">Create Account</button>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" *ngIf="!showRegister" class="auth-form">
      <label>
        <span>Email or Username</span>
        <input
          type="text"
          id="identifier"
          formControlName="identifier"
          [class.error]="loginForm.get('identifier')?.invalid && loginForm.get('identifier')?.touched"
          placeholder="team@ragitify.ai"
        />
        <small *ngIf="loginForm.get('identifier')?.invalid && loginForm.get('identifier')?.touched">Required field</small>
      </label>

      <label>
        <span>Password</span>
        <input
          type="password"
          id="password"
          formControlName="password"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          placeholder="••••••"
        />
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">Minimum 6 characters</small>
      </label>

      <button type="submit" class="btn-primary" [disabled]="loading || loginForm.invalid">
        <span *ngIf="!loading">Access Workspace</span>
        <span *ngIf="loading">Signing in...</span>
      </button>
    </form>

    <div *ngIf="showRegister" class="auth-form">
      <app-register (backToLogin)="toggleRegister()"></app-register>
    </div>
  </div>
</div>
