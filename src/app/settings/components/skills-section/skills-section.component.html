<div class="skills-section" *ngIf="!isLoading">

  <div class="section-header" style="margin-bottom: 1.25rem;">
    <h2 class="section-title">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      {{ hasExistingSkill ? 'Edit Skill' : 'New Skill Builder' }}
    </h2>

    <div class="header-actions">
      <div class="status-toggle-wrapper" [class.is-active]="skillForm.get('is_active')?.value">
        <span class="status-label">{{ skillForm.get('is_active')?.value ? 'Active' : 'Inactive' }}</span>
        <label class="toggle-switch">
          <input type="checkbox" [formControl]="$any(skillForm.get('is_active'))" (change)="toggleStatus($event)">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
  </div>

  <form [formGroup]="skillForm" (ngSubmit)="saveSkill()" class="skills-form"
    style="display: flex; flex-direction: column; gap: 1rem;">

    <!-- Combined Skill Form Box -->
    <div class="create-form">
      <div class="form-header-group">
        <h5>
          Skill Identity
        </h5>
      </div>

      <div class="form-group">
        <label for="name">SKILL NAME <span class="required"></span></label>
        <input type="text" id="name" formControlName="name" placeholder="e.g., Medical Report Summarizer"
          class="form-control" [class.is-invalid]="skillForm.get('name')?.invalid && skillForm.get('name')?.touched">
      </div>

      <div class="form-header-group" style="margin-top: 2rem;">
        <h5>
          Instructions
        </h5>
      </div>

      <div class="instruction-grid">
        <div class="form-group dos-group">
          <label for="dos">
            <i class="fa-regular fa-circle-check"></i> DO'S
            <span class="optional">One instruction per line</span>
          </label>
          <textarea id="dos" formControlName="dos"
            placeholder="Describe what this skill should do, how it should behave, tone, output style..."
            class="form-control"></textarea>
        </div>

        <div class="form-group donts-group">
          <label for="donts">
            <i class="fa-regular fa-circle-xmark"></i> DON'TS
            <span class="optional">One instruction per line</span>
          </label>
          <textarea id="donts" formControlName="donts"
            placeholder="Describe what this skill should avoid, topics to skip, behaviors to prevent..."
            class="form-control"></textarea>
        </div>
      </div>

      <!-- Actions contained inside the box -->
      <div class="form-actions-container">
        <div class="form-hint">
          <i class="fa-regular fa-lightbulb"></i> Changes apply to all new conversations
        </div>
        <div class="action-buttons">
          <button type="button" class="btn-premium-secondary" (click)="discard()">
            Discard
          </button>
          <button type="submit" class="btn-premium-primary" [disabled]="skillForm.invalid || isSaving || isValidating">
            <i class="fa-solid"
              [ngClass]="isValidating ? 'fa-magnifying-glass fa-beat' : (isSaving ? 'fa-spinner fa-spin' : 'fa-save')"></i>
            {{ isValidating ? 'Validating...' : (hasExistingSkill ? 'Update Skill' : 'Save Skill') }}
          </button>
        </div>
      </div>
    </div>
  </form>
</div>

<div class="empty-state" *ngIf="isLoading" style="margin-top: 2rem;">
  <i class="fa-solid fa-spinner fa-spin"></i>
  <p>Loading skill data...</p>
</div>
