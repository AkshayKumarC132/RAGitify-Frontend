<div class="settings-page">
  <div class="settings-shell">
    <header class="settings-header">
      <button class="back-button" (click)="goToHome()" aria-label="Back to home">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h4>Settings</h4>
    </header>

    <div class="settings-layout">
      <nav class="settings-sidebar" aria-label="Settings navigation">
        <a class="nav-item" routerLink="general" routerLinkActive="active">
          <i class="fa-solid fa-gear"></i>
          <span>General</span>
        </a>

        <a class="nav-item" routerLink="models" routerLinkActive="active">
          <i class="fa-solid fa-robot"></i>
          <span>Models</span>
        </a>

        <a class="nav-item" routerLink="account" routerLinkActive="active">
          <i class="fa-solid fa-user"></i>
          <span>Account</span>
        </a>
      </nav>

      <main class="settings-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
