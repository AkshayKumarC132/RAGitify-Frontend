<div class="settings-page">
  <div class="settings-shell">
    <aside class="settings-sidebar" aria-label="Settings navigation">
      <div class="settings-sidebar__brand">
        <button class="back-button" (click)="goToHome()" aria-label="Back to home">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="brand-copy">
          <span class="eyebrow">Workspace</span>
          <h1>Settings</h1>
        </div>
      </div>

      <button class="home-link" type="button" (click)="goToHome()">
        <span>Home</span>
      </button>

      <nav class="settings-nav">
        <a
          *ngFor="let section of sections"
          class="nav-item"
          [routerLink]="section.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="nav-item__icon">
            <i class="fa-solid" [ngClass]="section.icon"></i>
          </span>
          <span class="nav-item__copy">
            <span class="nav-item__label">{{ section.label }}</span>
            <span class="nav-item__description">{{ section.description }}</span>
          </span>
        </a>
      </nav>
    </aside>

    <main class="settings-main">
      <header class="settings-topbar">
        <div class="breadcrumb-bar" aria-label="Breadcrumb">
          <button class="breadcrumb-home" type="button" (click)="goToHome()">
            <span>Home</span>
          </button>
          <span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right" style="font-size: 0.8em;"></i></span>
          <span class="breadcrumb-link">Settings</span>
          <span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right" style="font-size: 0.8em;"></i></span>
          <span class="breadcrumb-current">{{ currentSectionLabel }}</span>
        </div>
      </header>

      <section class="settings-content">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</div>
