<div class="general-section">
  <div class="section-header">
    <h5 class="section-title">General</h5>
    <p class="section-desc">Changes apply instantly across every surface you
      use.</p>
  </div>

  <div class="settings-group">

    <div class="setting-card">
      <div class="setting-info">
        <label class="setting-label">Appearance</label>
        <span class="setting-desc">Switch between light and dark mode.</span>
      </div>
      <div class="setting-control">
        <div class="theme-segment-control">
          <ng-container *ngIf="theme$ | async as theme">
            <button type="button" class="segment-btn" [class.active]="theme === 'light'" (click)="setTheme('light')">
              <i class="fa-regular fa-sun"></i>
              <span>Light</span>
            </button>
            <button type="button" class="segment-btn" [class.active]="theme === 'dark'" (click)="setTheme('dark')">
              <i class="fa-regular fa-moon"></i>
              <span>Dark</span>
            </button>
          </ng-container>
        </div>
      </div>
    </div>

    <div class="setting-card">
      <div class="setting-info">
        <label class="setting-label">UI Style</label>
        <span class="setting-desc">Visual treatment for cards, panels, and surfaces.</span>
      </div>
      <div class="setting-control">
        <div class="style-options" *ngIf="style$ | async as currentStyle">
          <button type="button" class="style-card" [class.active]="currentStyle === 'default'"
            (click)="setStyle('default')">
            <i class="fa-solid fa-check active-check"></i>
            <div class="style-preview default"></div>
            <span>Default</span>
          </button>
          <button type="button" class="style-card" [class.active]="currentStyle === 'glass'"
            (click)="setStyle('glass')">
            <i class="fa-solid fa-check active-check"></i>
            <div class="style-preview glass"></div>
            <span>Glass</span>
          </button>
          <button type="button" class="style-card" [class.active]="currentStyle === 'neumorphic'"
            (click)="setStyle('neumorphic')">
            <i class="fa-solid fa-check active-check"></i>
            <div class="style-preview neumorphic"></div>
            <span>Neumorphic</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
