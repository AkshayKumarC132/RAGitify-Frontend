<div class="playground-container" [class.has-messages]="messages.length > 0">
    <div class="playground-topbar">
        <button class="close-btn" type="button" (click)="closed.emit()" title="Exit Playground"
            aria-label="Exit Playground">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
    </div>

    <div class="playground-header" *ngIf="messages.length === 0">
        <h1><i class="fa-brands fa-rocketchat" aria-hidden="true"></i> Playground</h1>
        <p>Feel free to try prompts — messages here are not saved.</p>
    </div>

    <div class="chat-messages" #messagesContainer>
        <app-message-bubble *ngFor="let msg of messages; let last = last" [message]="msg" [isLast]="last"
            [showSources]="false">
        </app-message-bubble>

        <app-typing-indicator *ngIf="loading" [cycle]="true"></app-typing-indicator>
    </div>

    <div class="input-area-wrapper">
        <div class="input-card">
            <div class="attachment-controls">
                <button class="add-button" [class.active]="attachmentMenuOpen" title="Attach Documents"
                    (click)="toggleAttachmentMenu()">
                    <i class="fa-solid fa-plus"></i>
                </button>

                <div class="attachment-menu" *ngIf="attachmentMenuOpen" (click)="$event.stopPropagation()">
                    <button type="button" (click)="openLibraryPanel()"
                        [disabled]="librariesLoaded && !libraries.length">
                        <i class="fa-solid fa-book"></i> Attach Documents
                    </button>
                </div>
            </div>

            <div class="integrated-mode-badge temp">
                <i class="fa-regular fa-clock"></i> Temp
            </div>
            <div class="integrated-mode-badge doc" *ngIf="mode === 'document'">
                <i class="fa-solid fa-file-lines"></i> Docs
            </div>

            <textarea [(ngModel)]="inputMessage" (keydown)="onKeyPress($event)" placeholder="How can I help you today?"
                [disabled]="loading || !conversationId" rows="1"></textarea>

            <div class="right-actions">
                <button class="send-btn" (click)="sendMessage()" [disabled]="!inputMessage.trim() || loading">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>

            <!-- Library Selection Panel -->
            <div class="attachment-panel" *ngIf="libraryPanelOpen" (click)="$event.stopPropagation()">
                <h4>Attach Documents</h4>

                <div class="library-list">
                    <ng-container *ngIf="libraries.length; else emptyLibrary">
                        <label *ngFor="let library of libraries"
                            (click)="toggleLibrarySelectionClick(library.id, $event)">
                            <input type="checkbox" [checked]="isLibrarySelected(library.id)" />
                            <div class="library-meta">
                                <span class="title">{{ library.name }}</span>
                                <span class="meta">Created {{ library.created_at | date:'MMM d, y' }}</span>
                            </div>
                        </label>
                    </ng-container>
                </div>

                <ng-template #emptyLibrary>
                    <p class="empty-text">Create a library in Workspace first to attach it.</p>
                </ng-template>

                <div class="panel-actions">
                    <button type="button" (click)="confirmSelection()" [disabled]="!pendingVectorStoreIds.size">
                        Apply
                    </button>
                    <button type="button" (click)="clearSelection()">Clear</button>
                    <button type="button" (click)="closePanel()">Close</button>
                </div>
            </div>
        </div>

        <div class="selection-pills" *ngIf="selectionCount > 0" (mouseenter)="onSelectionPillEnter()"
            (mouseleave)="onSelectionPillLeave()">
            <div class="attachment-pill">
                <span>{{ selectionLabel }}</span>
                <button type="button" (click)="clearSelection()">×</button>
            </div>

            <!-- Current vector store selections (shown to the right while hovering) -->
            <div class="attachment-pill attachment-pill--secondary"
                *ngIf="showVectorStoreHoverDetails && selectedVectorStores.length > 0">
                <span class="pill-title">Libraries:</span>
                <span class="pill-chip" *ngFor="let store of selectedVectorStores">
                    {{ store.name }}
                    <button type="button" (click)="removeSelectedVectorStore(store.id, $event)"
                        aria-label="Remove vector store">×</button>
                </span>
            </div>
        </div>

        <!-- <div class="mode-indicator" [class.document]="mode === 'document'">
            {{ mode === 'normal' ? 'Play Ground Active' : 'Document Mode Active' }}
        </div> -->
        <div class="error-toast" *ngIf="errorMessage">{{ errorMessage }}</div>
    </div>
</div>
