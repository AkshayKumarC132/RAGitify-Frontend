<div class="incognito-frame">
    <div class="playground-topbar">
        <div class="topbar-left">
            <i class="fa-solid fa-ghost"></i>
            <span>Incognito chat</span>
        </div>
        <button class="close-btn" type="button" (click)="closed.emit()" title="Exit Incognito"
            aria-label="Exit Playground">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
    </div>
    <div class="playground-container" [class.has-messages]="messages.length > 0">

        <div class="playground-error" *ngIf="warningMessages.length">
            {{ warningMessages.join(' ') }}
        </div>

        <div class="playground-header" *ngIf="messages.length === 0">
            <h1>Let's chat incognito</h1>
        </div>

        <div class="chat-messages" #messagesContainer>
            <app-message-bubble *ngFor="let msg of messages; let last = last" [message]="msg" [isLast]="last"
                [isStreaming]="last && loading && msg.role === 'assistant'">
            </app-message-bubble>
            <app-task-list [tasks]="currentTasks" [visible]="showTaskList"></app-task-list>
        </div>

        <div class="input-area-wrapper">
            <app-chat-input
                [class.home-chat-mode]="messages.length === 0"
                [mode]="mode"
                [loading]="loading"
                [libraries]="libraries"
                [documents]="allDocuments"
                [selectedDocumentIds]="selectedDocumentIds"
                [databaseConnections]="allDatabaseConnections"
                [databaseConnectionsLoading]="databaseConnectionsLoading"
                [selectedDatabaseConnectionIds]="selectedDatabaseConnectionIds"
                [librariesLoading]="librariesLoading"
                [documentsLoading]="documentsLoading"
                [isTemporaryChat]="true"
                [hasExistingThread]="messages.length > 0"
                (messageSent)="onMessageSent($event)"
                (modeToggle)="onModeToggle($event)"
                (librarySelected)="onLibrarySelected($event)"
                (attachmentPanelOpened)="onAttachmentPanelOpened($event)">
            </app-chat-input>

            <div class="suggested-questions" *ngIf="messages.length === 0">
                <button type="button" class="question-pill" *ngFor="let question of suggestedQuestions"
                    (click)="onQuestionClick(question)">
                    {{ question }}
                </button>
            </div>

            <div class="error-toast" *ngIf="errorMessage">{{ errorMessage }}</div>

            <div class="incognito-footer-note" *ngIf="messages.length === 0">
                Private session • Nothing is saved<br>

            </div>
        </div>
    </div>
</div>

<!-- ── Database connection warning modal ──────────────────────────────────── -->
<app-connection-warning-modal
  *ngIf="showConnectionWarningModal"
  [failedConnections]="failedDbConnections"
  (retry)="onConnectionWarningRetry()"
  (editConnection)="onConnectionWarningEdit($event)"
  (dismiss)="onConnectionWarningDismiss()">
</app-connection-warning-modal>
