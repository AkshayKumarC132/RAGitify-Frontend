<div class="chat-container">
  <div class="messages-list" #messagesWrapper (scroll)="onScroll()">
    <app-message-bubble *ngFor="let message of messages; let last = last; trackBy: trackByMessage"
      [message]="message" [isLast]="last" [isStreaming]="last && isTyping && message.role === 'assistant'">
    </app-message-bubble>

    <app-typing-indicator *ngIf="showTypingIndicator" [cycle]="true" [statuses]="typingStatuses"></app-typing-indicator>
  </div>

  <button type="button" class="jump-to-bottom-btn" *ngIf="showJumpToBottom" (click)="jumpToBottom()"
    aria-label="Jump to bottom">
    <i class="fa-solid fa-arrow-circle-down" aria-hidden="true"></i>
  </button>
</div>
