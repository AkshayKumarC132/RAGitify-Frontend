<div class="chat-container">
  <div class="messages-list" #messagesWrapper (scroll)="onScroll()">
    <app-message-bubble *ngFor="let message of messages; let last = last; trackBy: trackByMessage" [message]="message"
      [isLast]="last"></app-message-bubble>

    <div *ngIf="currentRun && (currentRun.status === 'queued' || currentRun.status === 'in_progress')"
      class="loading-indicator">
      <div class="typing-indicator">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <button
    type="button"
    class="jump-to-bottom-btn"
    *ngIf="showJumpToBottom"
    (click)="jumpToBottom()"
    aria-label="Jump to bottom"
  >
    <i class="fa-solid fa-arrow-circle-down" aria-hidden="true"></i>
  </button>
</div>
