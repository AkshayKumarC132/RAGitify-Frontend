<div class="thread-sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header" [class.show-expand-control]="collapsed && hoveringExpandControl">
    <button type="button" class="brand-toggle" (click)="toggleSidebar(undefined, $event)"
      [attr.title]="collapsed ? 'Expand menu' : 'Collapse menu'" (mouseenter)="handleBrandExpandInteraction(true)"
      (mouseleave)="handleBrandExpandInteraction(false)" (focus)="handleBrandExpandInteraction(true)"
      (blur)="handleBrandExpandInteraction(false)">
      <img src="assets/images/ragitify-logo.svg" alt="RAGitify logo" class="brand-logo" />
      <div class="brand-text" *ngIf="!collapsed">
        <div class="brand-title">RAGitify</div>
        <!-- <div class="brand-subtitle">AI Workspace</div> -->
      </div>
    </button>

    <button class="sidebar-toggle-control" type="button" (click)="toggleSidebar(undefined, $event)"
      [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      (mouseenter)="handleToggleExpandInteraction(true)" (mouseleave)="handleToggleExpandInteraction(false)"
      (focus)="handleToggleExpandInteraction(true)" (blur)="handleToggleExpandInteraction(false)">
      <i class="fa-solid" [ngClass]="collapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
    </button>
  </div>

  <div class="sidebar-actions">
    <button class="new-thread-button" type="button" (click)="createNewThread()"
      [attr.title]="collapsed ? 'Start a new chat' : null">
      <i class="fa-solid fa-plus"></i>
      <span class="button-text" *ngIf="!collapsed">New Chat</span>
    </button>
    <button class="workspace-button" type="button" (click)="goToWorkspace()"
      [attr.title]="collapsed ? 'Open workspace' : null">
      <i class="fa-solid fa-briefcase"></i>
      <span class="button-text" *ngIf="!collapsed">Workspace</span>
    </button>
    <button class="workspace-button" type="button" (click)="goToConnections()"
      [attr.title]="collapsed ? 'Open connectors' : null">
      <i class="fa-solid fa-plug"></i>
      <span class="button-text" *ngIf="!collapsed">Connectors</span>
    </button>
    <div class="threads-search">
      <div class="search-input-wrapper" (click)="openSearchPopup($event)" [attr.title]="'Search threads'">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search by title or message" [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchChange($event)" (click)="$event.stopPropagation(); openSearchPopup()" readonly />
      </div>
    </div>
  </div>

  <div class="threads-section" *ngIf="!collapsed">
    <div class="section-title">
      <i class="fa-solid fa-message"></i>
      <span>Chats</span>
    </div>

    <ng-template #threadItemTpl let-thread>
      <div class="thread-item" [class.active]="currentThread?.id === thread.id" [ngClass]="{
            'search-has-title-match': searchQuery && isTitleMatch(thread),
            'search-has-message-match': searchQuery && isMessageMatch(thread)
          }" (click)="selectThread(thread)" [attr.title]="collapsed ? getThreadTitle(thread) : null">
        <div class="thread-icon" *ngIf="collapsed">
          <div class="title-slice">{{ getTitleSlice(thread) }}</div>
        </div>

        <div class="thread-content" [class.expanded]="!collapsed">
          <div class="thread-title single-line">
            <ng-container *ngIf="!searchQuery; else highlightedTitle">
              <app-typing-label [text]="getThreadTitle(thread)"></app-typing-label>
            </ng-container>
            <ng-template #highlightedTitle>
              <span [innerHTML]="getHighlightedTitle(thread)"></span>
            </ng-template>
          </div>

          <div class="thread-snippet" *ngIf="searchQuery && isMessageMatch(thread)">
            <span [innerHTML]="getHighlightedSnippet(thread)"></span>
          </div>
          <div class="thread-time" *ngIf="!collapsed">
            <i class="fa-solid fa-thumbtack pinned-icon" *ngIf="isPinned(thread)" [attr.title]="'Pinned'"></i>
            {{ formatTime(getThreadDisplayTimestamp(thread)) }}
          </div>
        </div>

        <ng-container *ngIf="isProcessing(thread.id); else showMenu">
          <div class="thread-action-slot processing">
            <div class="processing-loader"></div>
            <button class="thread-menu" type="button" (click)="toggleThreadMenu(thread, $event)"
              [attr.aria-expanded]="threadMenuOpen === thread.id" aria-label="Thread options">
              <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
            </button>
          </div>
        </ng-container>
        <ng-template #showMenu>
          <button class="thread-menu" type="button" (click)="toggleThreadMenu(thread, $event)"
            [attr.aria-expanded]="threadMenuOpen === thread.id" aria-label="Thread options">
            <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
          </button>
        </ng-template>
      </div>
    </ng-template>

    <div class="threads-list" [class.has-search-results]="searchQuery && filteredThreads.length > 0"
      [class.is-virtual]="useVirtualScroll" (scroll)="handleThreadsScroll()">
      <ng-container *ngIf="loading && filteredThreads.length === 0" aria-busy="true" aria-label="Loading threads">
        <app-skeleton variant="list-item" [count]="6"></app-skeleton>
      </ng-container>

      <!-- Virtual scroll path: kicks in once the list grows beyond VIRTUAL_THRESHOLD,
           keeping the DOM lean for users with hundreds of threads. -->
      <cdk-virtual-scroll-viewport *ngIf="useVirtualScroll" itemSize="64" minBufferPx="240" maxBufferPx="480"
        class="threads-virtual-viewport">
        <ng-container *cdkVirtualFor="let thread of filteredThreads; trackBy: trackByThreadId">
          <ng-container *ngTemplateOutlet="threadItemTpl; context: { $implicit: thread }"></ng-container>
        </ng-container>
      </cdk-virtual-scroll-viewport>

      <!-- Plain list for short lists: avoids the virtual-scroll wrapper height contract
           and keeps natural sizing for items with variable height (e.g., search snippets). -->
      <ng-container *ngIf="!useVirtualScroll">
        <ng-container *ngFor="let thread of filteredThreads; trackBy: trackByThreadId">
          <ng-container *ngTemplateOutlet="threadItemTpl; context: { $implicit: thread }"></ng-container>
        </ng-container>
      </ng-container>
    </div>
  </div>

  <!-- Fixed bottom profile - always visible if user exists -->
  <div class="sidebar-profile profile-region" *ngIf="user">
    <button class="profile-trigger" type="button" (click)="toggleProfileMenu($event)"
      [attr.title]="collapsed ? getProfileName(user) : null">
      <div class="avatar" [attr.aria-label]="getProfileName(user)">
        {{ getInitials(user!.first_name, user!.last_name, user!.email) }}
      </div>

      <div class="profile-meta" *ngIf="!collapsed">
        <div class="profile-name">{{ getProfileName(user) }}</div>
        <div class="profile-email">{{ user!.email }}</div>
      </div>

      <i class="fa-solid" [ngClass]="profileMenuOpen ? 'fa-angle-up' : 'fa-angle-down'" *ngIf="!collapsed"></i>
    </button>

    <!-- Dropdown menu (expanded sidebar) -->
    <div class="profile-dropdown" *ngIf="profileMenuOpen && !collapsed">
      <button type="button" (click)="openSettings($event)">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
      </button>
      <button type="button" (click)="requestLogout($event)">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>

  <!-- Profile menu panel (collapsed sidebar) -->
  <div class="profile-menu-panel" *ngIf="profileMenuOpen && collapsed && profileMenuPosition"
    [ngStyle]="{ top: profileMenuPosition.top + 'px', left: profileMenuPosition.left + 'px' }"
    [class.open-left]="profileMenuOpensLeft" (click)="$event.stopPropagation()">
    <button type="button" (click)="openSettings($event)">
      <i class="fa-solid fa-gear"></i>
      <span>Settings</span>
    </button>
    <button type="button" (click)="requestLogout($event)">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Logout</span>
    </button>
  </div>

  <div class="thread-menu-panel" *ngIf="threadMenuOpen && menuThread && threadMenuPosition"
    [ngStyle]="{ top: threadMenuPosition.top + 'px', left: threadMenuPosition.left + 'px' }"
    [class.open-left]="menuOpensLeft" (click)="$event.stopPropagation()">
    <button type="button" (click)="togglePin(menuThread, $event)">
      <i class="fa-solid" [ngClass]="isPinned(menuThread) ? 'fa-thumbtack-slash' : 'fa-thumbtack'"></i>
      <span>{{ isPinned(menuThread) ? 'Unpin' : 'Pin' }}</span>
    </button>
    <button type="button" (click)="editThread(menuThread, $event)">
      <i class="fa-solid fa-pen"></i>
      <span>Rename Title</span>
    </button>
    <button type="button" class="toggle-menu-item" (click)="toggleDataGrid(menuThread, $event)">
      <i class="fa-solid fa-table-cells"></i>
      <span class="flex-grow">Show Data</span>
      <div class="toggle-switch" [class.active]="menuThread.enable_data_grid">
        <div class="toggle-knob"></div>
      </div>
    </button>
    <button type="button" class="danger" (click)="deleteThread(menuThread, $event)">
      <i class="fa-solid fa-trash"></i>
      <span>Delete</span>
    </button>
  </div>
</div>
