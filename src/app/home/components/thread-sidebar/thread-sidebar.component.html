<div class="thread-sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <div class="brand">
      <img src="assets/images/ragitify-logo.svg" alt="RAGitify logo" class="brand-logo" />
      <div class="brand-text" *ngIf="!collapsed">
        <div class="brand-title">RAGitify</div>
        <div class="brand-subtitle">AI Workspace</div>
      </div>
    </div>

    <button
      type="button"
      class="sidebar-toggle"
      (click)="toggleSidebar()"
      [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <i class="fa-solid" [ngClass]="collapsed ? 'fa-angles-right' : 'fa-angles-left'"></i>
    </button>
  </div>

  <div class="user-profile" *ngIf="user">
    <div class="profile-summary">
      <div class="avatar" [attr.title]="user!.username">
        {{ getInitials(user!.first_name, user!.last_name, user!.username) }}
      </div>
      <div class="profile-meta" *ngIf="!collapsed">
        <div class="profile-name">{{ getProfileName(user) }}</div>
        <div class="profile-email">{{ user!.email }}</div>
      </div>
    </div>
    <button
      class="profile-manage"
      type="button"
      (click)="manageProfile.emit()"
      [attr.title]="collapsed ? 'Manage profile' : null"
    >
      <i class="fa-solid fa-user-gear" aria-hidden="true"></i>
      <span *ngIf="!collapsed">Manage</span>
    </button>
  </div>

  <div class="sidebar-actions">
    <button
      class="new-thread-button"
      type="button"
      (click)="createNewThread()"
      [attr.title]="collapsed ? 'Start a new chat' : null"
    >
      <i class="fa-solid fa-plus"></i>
      <span class="button-text" *ngIf="!collapsed">New Chat</span>
    </button>
    <button
      class="workspace-button"
      type="button"
      (click)="goToWorkspace()"
      [attr.title]="collapsed ? 'Open workspace' : null"
    >
      <i class="fa-solid fa-briefcase"></i>
      <span class="button-text" *ngIf="!collapsed">Workspace</span>
    </button>
  </div>

  <div class="threads-section">
    <div class="section-title" *ngIf="!collapsed">Today</div>
    <div class="threads-list">
      <div
        *ngFor="let thread of threads"
        class="thread-item"
        [class.active]="currentThread?.id === thread.id"
        (click)="selectThread(thread)"
        [attr.title]="collapsed ? getThreadTitle(thread) : null"
      >
        <div class="title-slice">{{ getTitleSlice(thread) }}</div>
        <div class="thread-details" *ngIf="!collapsed">
          <div class="thread-title">{{ getThreadTitle(thread) }}</div>
          <div class="thread-time">{{ formatTime(thread.created_at) }}</div>
        </div>

        <button
          class="thread-menu"
          type="button"
          (click)="toggleThreadMenu(thread, $event)"
          [attr.aria-expanded]="threadMenuOpen === thread.id"
        >
          <i class="fa-solid fa-ellipsis"></i>
        </button>

        <div class="thread-menu-panel" *ngIf="threadMenuOpen === thread.id">
          <button type="button" (click)="editThread(thread, $event)">Edit Title</button>
          <button type="button" (click)="deleteThread(thread, $event)">Delete Thread</button>
        </div>
      </div>
    </div>
  </div>
</div>
