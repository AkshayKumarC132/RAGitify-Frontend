<div class="home-container">
  <div class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <app-thread-sidebar
      [threads]="threads"
      [currentThread]="currentThread"
      (threadSelected)="onThreadSelected($event)"
      (newThread)="onNewThread()"
      (workspaceNavigate)="onWorkspaceNavigate()"
      [collapsed]="isSidebarCollapsed"
      (sidebarToggled)="onSidebarToggled($event)"
    ></app-thread-sidebar>

    <div class="sidebar-footer">
      <button
        class="logout-button"
        (click)="logout()"
        [attr.title]="isSidebarCollapsed ? 'Logout' : null"
        aria-label="Logout"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
        <span class="button-text" *ngIf="!isSidebarCollapsed">Logout</span>
      </button>
    </div>
  </div>

  <div class="main-content">
    <div class="chat-area">
      <div class="chat-toolbar">
        <div class="toolbar-label">
          <i class="fa-solid fa-robot" aria-hidden="true"></i>
          <span>Active model</span>
        </div>
        <app-model-selector
          [models]="availableModels"
          [selectedModel]="selectedModel"
          (modelSelected)="onModelSelected($event)"
        ></app-model-selector>
      </div>

      <app-empty-state *ngIf="!currentThread && messages.length === 0"></app-empty-state>

      <app-chat-container
        *ngIf="currentThread || messages.length > 0"
        [messages]="messages"
        [currentRun]="currentRun"
      ></app-chat-container>
    </div>

    <div class="input-area">
      <app-chat-input
        [mode]="mode"
        [loading]="loading || attachmentsInProgress"
        [libraries]="libraries"
        [selectedLibraryId]="selectedLibraryId"
        [prompts]="prompts"
        [selectedPromptId]="selectedPromptId"
        (messageSent)="onMessageSent($event)"
        (modeToggle)="onModeToggle($event)"
        (filesSelected)="onFilesSelected($event)"
        (webpageAttached)="onWebpageAttach($event)"
        (notesAttached)="onNotesAttach($event)"
        (librarySelected)="onLibrarySelected($event)"
        (promptSelected)="onPromptSelected($event)"
      ></app-chat-input>

      <div class="attachment-status" *ngIf="attachmentMessage">
        {{ attachmentMessage }}
      </div>
    </div>
  </div>
</div>
