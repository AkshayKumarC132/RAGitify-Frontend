<div class="home-container">
  <div class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <app-thread-sidebar
      [threads]="threads"
      [currentThread]="currentThread"
      [user]="currentUser"
      (threadSelected)="onThreadSelected($event)"
      (newThread)="onNewThread()"
      (workspaceNavigate)="onWorkspaceNavigate()"
      [collapsed]="isSidebarCollapsed"
      (sidebarToggled)="onSidebarToggled($event)"
      (manageProfile)="onManageProfile()"
      (logoutRequested)="logout()"
      (renameThread)="onThreadRename($event)"
      (removeThread)="onThreadRemove($event)"
    ></app-thread-sidebar>
  </div>

  <div class="main-content" [class.empty-mode]="isConversationEmpty">
    <div class="chat-area">
      <!-- <div class="chat-toolbar">
        <div class="toolbar-label">
          <i class="fa-solid fa-robot" aria-hidden="true"></i>
          <span>{{ selectedModel?.name || selectedModel?.model || 'Default Model' }}</span>
        </div>
        <div class="toolbar-label">
          <i class="fa-regular fa-clock" aria-hidden="true"></i>
          <span>{{ selectedModel?.provider || 'Auto' }}</span>
        </div>
      </div> -->

      <app-empty-state *ngIf="isConversationEmpty"></app-empty-state>

      <app-chat-container
        *ngIf="!isConversationEmpty"
        [messages]="messages"
        [currentRun]="currentRun"
      ></app-chat-container>
    </div>

    <div class="input-area" [class.centered]="isConversationEmpty">
      <app-chat-input
        [mode]="mode"
        [loading]="loading || attachmentsInProgress"
        [libraries]="libraries"
        [selectedLibraryId]="selectedLibraryId"
        [documents]="allDocuments"
        [selectedDocumentIds]="selectedDocumentIds"
        [prompts]="prompts"
        [selectedPromptId]="selectedPromptId"
        (messageSent)="onMessageSent($event)"
        (modeToggle)="onModeToggle($event)"
        (filesSelected)="onFilesSelected($event)"
        (webpageAttached)="onWebpageAttach($event)"
        (notesAttached)="onNotesAttach($event)"
        (librarySelected)="onLibrarySelected($event)"
        (promptSelected)="onPromptSelected($event)"
      ></app-chat-input>

      <div class="attachment-status" *ngIf="attachmentMessage">
        {{ attachmentMessage }}
      </div>
    </div>
  </div>
</div>

<div class="profile-panel" *ngIf="showProfilePanel" (click)="closeProfilePanel()">
  <div class="profile-card" (click)="$event.stopPropagation()">
    <div class="profile-card-header">
      <div>
        <h3>User Profile</h3>
        <p>Review and update your workspace identity</p>
      </div>
      <button type="button" class="icon-button" (click)="closeProfilePanel()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="profile-form">
      <label>
        <span>First Name</span>
        <input type="text" formControlName="first_name" placeholder="First name" />
      </label>
      <label>
        <span>Last Name</span>
        <input type="text" formControlName="last_name" placeholder="Last name" />
      </label>
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="email@ragitify.ai" readonly />
        <small *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched">Enter a valid email</small>
      </label>

      <div class="profile-message" *ngIf="profileMessage">{{ profileMessage }}</div>

      <div class="profile-actions">
        <button type="button" (click)="closeProfilePanel()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="profileForm.invalid">Save Changes</button>
      </div>
    </form>
  </div>
</div>
