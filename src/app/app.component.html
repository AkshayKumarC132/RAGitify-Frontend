<a href="#main-content" class="skip-to-content">Skip to main content</a>
<app-top-progress></app-top-progress>
<main id="main-content" tabindex="-1">
  <router-outlet></router-outlet>
</main>
<app-toast></app-toast>

<div class="global-loader" *ngIf="loading$ | async">
  <div class="loader-backdrop"></div>
  <div class="loader-card" role="status" aria-live="polite">
    <span class="loader-ring" aria-hidden="true"></span>
  </div>
</div>

<ng-container *ngIf="dialogState$ | async as dialogState">
  <app-confirm-dialog *ngIf="dialogState.show && dialogState.options" [data]="dialogState.options"
    (confirmed)="onDialogConfirmed($event)">
  </app-confirm-dialog>
</ng-container>

<ng-container *ngIf="searchPopupState$ | async as popupState">
  <app-thread-search-popup *ngIf="popupState.show" [threads]="popupState.threads"
    [currentThread]="popupState.currentThread" (threadSelected)="onThreadSelected($event)"
    (closed)="onSearchPopupClosed()">
  </app-thread-search-popup>
</ng-container>
